services:
  litestream:
    image: litestream/litestream:0.3.13
    container_name: free-form-litestream
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET}
      - LITESTREAM_PATH=${LITESTREAM_PATH:-freeform-db}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT}
      - LITESTREAM_REGION=${LITESTREAM_REGION:-us-east-1}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
      - LITESTREAM_SYNC_INTERVAL=${LITESTREAM_SYNC_INTERVAL:-1s}
      - LITESTREAM_RETENTION=${LITESTREAM_RETENTION:-72h}
    depends_on:
      - free-form
