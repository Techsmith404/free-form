name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Client
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Extract Version & Package APK
        id: pkg_info
        run: |
          mkdir -p dist-apk
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${{ github.ref_name }}"
          
          if [[ "$TAG_NAME" == v* ]]; then
            APK_NAME="free-form-${TAG_NAME}.apk"
          else
            APK_NAME="free-form-v${VERSION}.apk"
          fi
          
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/${APK_NAME}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/free-form.apk"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg_info.outputs.apk_name }}
          path: dist-apk/${{ steps.pkg_info.outputs.apk_name }}
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apk/${{ steps.pkg_info.outputs.apk_name }}
            dist-apk/free-form.apk
          name: Free Form ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
