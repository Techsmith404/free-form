name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Client
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Extract Version & Package APK
        id: pkg_info
        run: |
          mkdir -p dist-apk
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${{ github.ref_name }}"
          
          if [[ "$TAG_NAME" == v* ]]; then
            APK_NAME="free-form-${TAG_NAME}.apk"
          else
            APK_NAME="free-form-v${VERSION}.apk"
          fi
          
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          cp "$APK_SRC" "dist-apk/${APK_NAME}"
          cp docker-compose.yml dist-apk/docker-compose.yml
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg_info.outputs.apk_name }}
          path: dist-apk/${{ steps.pkg_info.outputs.apk_name }}
          retention-days: 30

      - name: Create or Update GitHub Release (On Tag or Release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apk/${{ steps.pkg_info.outputs.apk_name }}
            dist-apk/docker-compose.yml
          name: Free Form ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
