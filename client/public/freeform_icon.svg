<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Card Linear Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2331"/>
      <stop offset="100%" stop-color="#161A25"/>
    </linearGradient>

    <!-- Card Rim Bevel Stroke Gradient -->
    <linearGradient id="cardStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B586E"/>
      <stop offset="25%" stop-color="#2D3647"/>
      <stop offset="100%" stop-color="#1C222C"/>
    </linearGradient>

    <!-- Main F Teal Gradient -->
    <linearGradient id="fTeal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1C7590"/>
      <stop offset="60%" stop-color="#18657E"/>
      <stop offset="100%" stop-color="#14576D"/>
    </linearGradient>

    <!-- Front Ribbon Gradient -->
    <linearGradient id="frontRibbon" x1="0.8" y1="0.2" x2="0.2" y2="0.8">
      <stop offset="0%" stop-color="#1C7793"/>
      <stop offset="45%" stop-color="#196982"/>
      <stop offset="100%" stop-color="#145A72"/>
    </linearGradient>

    <!-- Lower Stem Gradient (Behind front ribbon) -->
    <linearGradient id="stemLowerGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#186580"/>
      <stop offset="60%" stop-color="#155770"/>
      <stop offset="100%" stop-color="#11455B"/>
    </linearGradient>

    <!-- 3D Ribbon Fold Underside Shadow -->
    <linearGradient id="foldUnderside" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0E2D40"/>
      <stop offset="45%" stop-color="#123B52"/>
      <stop offset="100%" stop-color="#174E69"/>
    </linearGradient>

    <!-- Deep Crease Shadow under front ribbon -->
    <linearGradient id="creaseShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041220" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#041220" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Mint Gradient (Top Arm & Stem) -->
    <linearGradient id="neonMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#48BEB6"/>
      <stop offset="50%" stop-color="#4FCEBF"/>
      <stop offset="100%" stop-color="#55DBC7"/>
    </linearGradient>

    <!-- Neon Mint to Blue Outer Ribbon Gradient -->
    <linearGradient id="neonRibbonOuter" x1="1" y1="0.1" x2="0" y2="0.9">
      <stop offset="0%" stop-color="#4ECEBE"/>
      <stop offset="25%" stop-color="#42B8CA"/>
      <stop offset="55%" stop-color="#368ED3"/>
      <stop offset="100%" stop-color="#306ECE"/>
    </linearGradient>

    <!-- Neon Blue Bottom & Stem Edge Glow -->
    <linearGradient id="neonBlueSweep" x1="0" y1="1" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#306ECE"/>
      <stop offset="35%" stop-color="#3381D2"/>
      <stop offset="70%" stop-color="#3793D5"/>
      <stop offset="100%" stop-color="#3EAED7"/>
    </linearGradient>

    <!-- Inner Loop Fold Blue Highlight -->
    <linearGradient id="neonFoldBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#337DCF"/>
      <stop offset="100%" stop-color="#2562A8"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1024" height="1024" fill="#161A25"/>

  <!-- 2. Centered App Squircle Card -->
  <rect x="198" y="196" width="628" height="628" rx="142" ry="142"
        fill="url(#cardBg)"
        stroke="url(#cardStroke)"
        stroke-width="5.5"/>

  <!-- 3. Layer: Lower Stem (x=433..520, y=556 down to bottom loop) -->
  <path d="M 433 556
           L 520 556
           L 520 635
           C 520 670, 480 720, 395 733
           C 420 722, 433 685, 433 634
           Z"
        fill="url(#stemLowerGrad)"/>

  <!-- 3b. Ribbon 3D Fold (The twist connecting front loop to back stem) -->
  <path d="M 395 733
           C 420 722, 433 685, 433 634
           C 433 652, 418 663, 397 663
           C 375 663, 361 680, 395 733
           Z"
        fill="url(#foldUnderside)"/>

  <!-- Shadow directly under the middle crossbar crossing the stem -->
  <rect x="433" y="556" width="87" height="35" fill="url(#creaseShadow)"/>

  <!-- Neon Blue Stroke along the Lower Stem Right Edge and Bottom Sweep -->
  <path d="M 395 733
           C 480 720, 520 670, 520 635
           L 520 556"
        fill="none"
        stroke="url(#neonBlueSweep)"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Fold Crease Blue Highlight Accent -->
  <path d="M 397 663
           C 418 663, 433 652, 433 634"
        fill="none"
        stroke="url(#neonFoldBlue)"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- 4. Top Arm & Upper Stem -->
  <path d="M 433 291
           L 735 291
           L 735 379
           L 520 379
           L 520 468
           L 433 468
           Z"
        fill="url(#fTeal)"/>

  <!-- Top Arm & Upper Stem Neon Mint Outer Frame Stroke -->
  <path d="M 433 468
           L 433 291
           L 735 291
           L 735 379
           L 520 379
           L 520 468"
        fill="none"
        stroke="url(#neonMint)"
        stroke-width="8"
        stroke-linecap="square"
        stroke-linejoin="miter"/>

  <!-- 5. Front Ribbon (Middle Crossbar & Sweeping Loop) -->
  <path d="M 665 468
           C 575 468, 495 469, 433 472
           C 360 478, 290 538, 290 624
           C 290 685, 340 733, 395 733
           C 361 680, 375 663, 397 663
           C 375 663, 361 645, 361 626
           C 361 595, 395 572, 433 564
           L 665 556
           Z"
        fill="url(#frontRibbon)"/>

  <!-- Front Ribbon Outer Neon Glow Stroke (Mint to Electric Blue) -->
  <path d="M 665 468
           C 575 468, 495 469, 433 472
           C 360 478, 290 538, 290 624
           C 290 685, 340 733, 395 733"
        fill="none"
        stroke="url(#neonRibbonOuter)"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Front Ribbon Middle Crossbar Right Cap & Bottom Edge (Mint Neon) -->
  <path d="M 665 468
           L 665 556
           L 433 556"
        fill="none"
        stroke="url(#neonMint)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Front Ribbon Inner Teardrop Edge Accent -->
  <path d="M 433 564
           C 395 572, 361 595, 361 626
           C 361 645, 375 663, 397 663"
        fill="none"
        stroke="#337CCB"
        stroke-width="6.5"
        stroke-linecap="round"/>

</svg>
