services:
  free-form:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free-form
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - NODE_ENV=production
    volumes:
      - ./data:/data
