services:
  free-form:
    image: ghcr.io/techsmith404/free-form:latest
    container_name: free-form
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - NODE_ENV=production
      # - ACCOUNTS_ENABLED=true
      # - AUTH_REQUIRED=true
    volumes:
      - ./data:/data
